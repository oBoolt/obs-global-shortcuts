Description="Bind Shortcuts in XDG Desktop GlobalShortcuts portal"
BindToggleStreaming="Starts/Stops streaming"
BindToggleRecording="Starts/Stops recording"
BindPlayPauseRecording="Play/Pause current recording"
BindSplitRecordingFile="Asks OBS to split the current recording file"
BindAddChapter="Asks OBS to insert a chapter marker at the current output time into the recording"
BindToggleReplayBuffer="Starts/Stops the replay buffer"
BindSaveReplayBuffer="Saves a replay if the replay buffer is active"
BindToggleVirtualCamera="Starts/Stops the virtual camera"
